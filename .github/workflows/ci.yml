name: ci

# Every PR and every push to main: the action-pin check, a frozen install under safe-chain, tests, the publish build,
# `bun pm pack`, and a plain-Node ESM import of the packed tarball on Node 22 and 24. This repo is a one-way export
# of Bankr's monorepo (CONTRIBUTING.md), where the same checks run before every export.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A PR's newer push cancels its older run; each main run keeps its own group so every merge keeps its result.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, build, pack and import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Every action is pinned to a commit SHA
        run: bun run scripts/check-workflow-pins.ts

      - name: Set up safe-chain
        uses: ./.github/actions/setup-safe-chain
        with:
          verify-with: bun

      # bunfig.toml also refuses package versions younger than 48 hours.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Pack
        id: pack
        run: |
          DEST="${RUNNER_TEMP}/launch-sdk-pack"
          mkdir -p "$DEST"
          bun pm pack --ignore-scripts --destination "$DEST"
          TARBALLS=("$DEST"/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::expected one tarball in ${DEST}, found ${#TARBALLS[@]}"
            exit 1
          fi
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: ESM import of the tarball on Node 22
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/smoke-node-import.mjs "$TARBALL"

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: ESM import of the tarball on Node 24
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/smoke-node-import.mjs "$TARBALL"
